<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Group Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8793a1);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.03);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .wrapper {
            max-width: 420px;
            margin: auto;
        }
        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 20px;
            text-align: center;
        }
        .section-card {
            background: var(--card-bg);
            border: 1px solid rgba(135, 147, 161, 0.15);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--hint-color);
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(135, 147, 161, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        select option {
            background-color: #18222d;
            color: #ffffff;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        .helper-text {
            font-size: 11px;
            color: var(--hint-color);
            margin-top: -4px;
            line-height: 1.3;
        }
        .file-input-wrapper {
            border: 2px dashed rgba(135, 147, 161, 0.35);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.01);
        }
        .file-input-wrapper input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid rgba(135, 147, 161, 0.3);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--button-color);
            border-color: var(--button-color);
            font-weight: 600;
        }
        .mode-select {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(135, 147, 161, 0.2);
        }
        .radio-label input {
            margin-right: 10px;
        }
        button.action-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.25);
        }
        button.action-btn:active {
            opacity: 0.85;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>Student Groups</h2>
        <div class="subtitle">Automated Telegram Group Creator</div>

        <!-- Teacher Contact Section -->
        <div class="section-card">
            <label>👨‍🏫 Teacher Contact</label>
            <select id="teacherSelect" onchange="handleTeacherSelection(this)">
                <option value="" disabled selected>-- Select Teacher Option --</option>
                <option value="manual">✏️ Type ID or @username</option>
            </select>
            
            <input type="text" id="teacherContact" placeholder="Enter Telegram ID or @username" style="display: none; margin-top: 6px;">
            <div class="helper-text" id="teacherHelper" style="margin-top: 4px;">💡 Choose an option from the dropdown list above.</div>
        </div>

        <!-- Student & Parent Data Input Section -->
        <div class="section-card">
            <label>👥 Student & Parent Data</label>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('excel')">📁 Import Excel</button>
                <button class="tab-btn" onclick="switchTab('text')">✏️ Type Text Data</button>
            </div>
            
            <div id="excelSection">
                <div class="file-input-wrapper">
                    <span id="fileName" style="font-size: 13px;">Tap to select Excel (.xlsx) file</span>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="fileSelected(this)">
                </div>
            </div>

            <div id="textSection" style="display: none;">
                <textarea id="manualText" placeholder="Format per line: StudentName, ParentID&#10;Alice, 123456789&#10;Bob, 987654321"></textarea>
            </div>
        </div>

        <!-- Group Creation Mode Section -->
        <div class="section-card">
            <label>⚙️ Group Mode & Naming</label>
            <div class="mode-select">
                <label class="radio-label">
                    <input type="radio" name="mode" value="individual" checked onclick="toggleGroupName(false)">
                    <span><b>Individual Groups:</b> 1 group per student (named after student) with parent & teacher</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="mode" value="unified" onclick="toggleGroupName(true)">
                    <span><b>Single Group:</b> Add all contacts into 1 group with a custom name</span>
                </label>
            </div>

            <div id="groupNameBox" style="display: none;">
                <label>🏷️ Custom Group Name</label>
                <input type="text" id="customGroupName" placeholder="e.g. Class 10A Parents & Students">
            </div>
        </div>

        <button class="action-btn" onclick="startProcess()">Start Creating Groups</button>
        <div id="status"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentTab = 'excel';

        function handleTeacherSelection(selectElement) {
            let val = selectElement.value;
            let inputField = document.getElementById('teacherContact');
            
            if (val === 'manual') {
                inputField.style.display = 'block';
                inputField.value = '';
                inputField.focus();
                document.getElementById('teacherHelper').innerText = "💡 Type the teacher's numeric ID or @username.";
            } else {
                inputField.style.display = 'none';
                inputField.value = val;
                document.getElementById('teacherHelper').innerText = "✅ Selected preset teacher.";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'excel') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('excelSection').style.display = 'block';
                document.getElementById('textSection').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('excelSection').style.display = 'none';
                document.getElementById('textSection').style.display = 'block';
            }
        }

        function fileSelected(input) {
            if(input.files.length > 0) {
                document.getElementById('fileName').innerText = "📄 " + input.files[0].name;
            }
        }

        function toggleGroupName(show) {
            document.getElementById('groupNameBox').style.display = show ? 'block' : 'none';
        }

        async function startProcess() {
            let selectEl = document.getElementById('teacherSelect').value;
            let teacher = selectEl === 'manual' ? document.getElementById('teacherContact').value.trim() : selectEl;
            let mode = document.querySelector('input[name="mode"]:checked').value;
            let customName = document.getElementById('customGroupName').value.trim();
            let statusDiv = document.getElementById('status');

            if (!teacher) {
                alert("Please select or enter the teacher's Telegram ID/username!");
                return;
            }

            let formData = new FormData();
            formData.append("teacher_contact", teacher);
            formData.append("mode", mode);
            formData.append("custom_group_name", customName);

            if (currentTab === 'excel') {
                let fileInput = document.getElementById('excelFile');
                if (fileInput.files.length === 0) {
                    alert("Please select an Excel file!");
                    return;
                }
                formData.append("file", fileInput.files[0]);
            } else {
                let textData = document.getElementById('manualText').value.trim();
                if (!textData) {
                    alert("Please enter student data in the text box!");
                    return;
                }
                formData.append("manual_text", textData);
            }

            statusDiv.innerText = "⏳ Processing groups... Please wait.";
            statusDiv.style.color = "#f39c12";

            try {
                let response = await fetch('/process-groups', {
                    method: 'POST',
                    body: formData
                });
                let result = await response.json();
                statusDiv.innerText = result.message || "Done!";
                statusDiv.style.color = "#2ecc71";
            } catch (error) {
                statusDiv.innerText = "❌ Error: " + error;
                statusDiv.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
